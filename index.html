<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勤怠計算アプリ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
  </script>

</head>
<body>

  <h2>勤怠計算</h2>

  <!-- 勤務パターン選択 -->
  <label>勤務パターン</label>
  <select id="pattern">
    <option value="">選択してください</option>
    <option value="am">午前だけ</option>
    <option value="pm">午後だけ</option>
    <option value="both">午前＋午後</option>
  </select>

  <!-- 午前の入力欄 -->
  <div id="am_section" class="section-card">
  <h3 class="section-title">午前勤務</h3>
    <label>午前 出勤時刻</label>
    <input type="time" id="am_start">

    <label>午前 退勤時刻</label>
    <input type="time" id="am_end">
  </div>

  <!-- 午後の入力欄 -->
  <div id="pm_section" class="section-card">
  <h3 class="section-title">午後勤務</h3>
    <label>午後 出勤時刻</label>
    <input type="time" id="pm_start">

    <label>午後 退勤時刻</label>
    <input type="time" id="pm_end">
  </div>

  <!-- 時給入力欄（初期値1180円） -->
  <label>時給（円）</label>
  <input type="number" id="wage" value="1180">

  <button id="calc">計算する</button>

  <div id="result" class="section-card"></div>

  <script src="app.js"></script>
</body>
</html>
