<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勤怠計算アプリ</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/kinmu-app/manifest.json">

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/kinmu-app/service-worker.js");
    }
  </script>
</head>
<body>

  <h2>勤怠計算</h2>

  <label>勤務パターン</label>
  <select id="pattern">
    <option value="">選択してください</option>
    <option value="am">午前だけ</option>
    <option value="pm">午後だけ</option>
    <option value="both">午前＋午後</option>
  </select>

  <label>勤務日付</label>
  <input type="date" id="work_date">

  <div id="am_section" class="section-card">
    <h3 class="section-title">午前勤務</h3>
    <label>午前 出勤時刻</label>
    <input type="time" id="am_start">

    <label>午前 退勤時刻</label>
    <input type="time" id="am_end">
  </div>

  <div id="pm_section" class="section-card">
    <h3 class="section-title">午後勤務</h3>
    <label>午後 出勤時刻</label>
    <input type="time" id="pm_start">

    <label>午後 退勤時刻</label>
    <input type="time" id="pm_end">
  </div>

  <label>時給（円）</label>
  <input type="number" id="wage" value="1180">

  <button id="calc">計算する</button>
  <button id="save">この勤務を保存する</button>

  <div id="result" class="section-card"></div>

  <button onclick="location.href='monthly.html'">月次一覧を見る</button>

  <script src="app.js"></script>
</body>
</html>
